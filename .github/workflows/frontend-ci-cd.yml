name: Hospital System - Frontend CI/CD (Dev to Prod Promotion)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  AWS_REGION: us-east-1
  DEV_S3_BUCKET: hospital-system-dev-frontend-assets
  PROD_S3_BUCKET: hospital-system-prod-frontend-assets

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # Stage 1: Security Scanning & Build Verification
  # ============================================================================
  security-and-build:
    name: Security & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks: Secret Detection
      - name: Run Gitleaks Secret Scanner
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source "$GITHUB_WORKSPACE" --verbose --redact --no-git

      # 2. Node.js Setup
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Install Dependencies
      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # 4. Compile Production React Bundle (Single-origin /api routed through CloudFront)
      - name: Build Production Static Bundle
        run: npm run build
        env:
          CI: false
          REACT_APP_API_BASE_URL: ""

      # 5. Archive Build Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 1

  # ============================================================================
  # Stage 2: Automated Deploy to DEV Environment (S3 & CloudFront)
  # ============================================================================
  deploy-dev:
    name: Deploy to DEV Environment (S3 & CloudFront)
    needs: security-and-build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build/

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sync Static Bundle to DEV Amazon S3
        run: |
          echo "Deploying to DEV S3 bucket: ${{ env.DEV_S3_BUCKET }}..."
          aws s3 sync build/ s3://${{ env.DEV_S3_BUCKET }}/ --delete

      - name: Invalidate DEV CloudFront Cache
        if: env.DEV_CF_ID != ''
        env:
          DEV_CF_ID: ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "Invalidating DEV CloudFront Distribution: $DEV_CF_ID..."
          aws cloudfront create-invalidation --distribution-id "$DEV_CF_ID" --paths "/*"

  # ============================================================================
  # Stage 3: Promotion to PROD Environment (Guarded by GitHub Environment Approval)
  # ============================================================================
  promote-prod:
    name: Promote to PRODUCTION Environment (S3 & CloudFront)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://devopsstandard.name.ng

    steps:
      - name: Download Same Verified Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build/

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sync Verified Bundle to PRODUCTION Amazon S3
        run: |
          echo "Promoting verified bundle to PRODUCTION S3 bucket: ${{ env.PROD_S3_BUCKET }}..."
          aws s3 sync build/ s3://${{ env.PROD_S3_BUCKET }}/ --delete

      - name: Invalidate PRODUCTION CloudFront Cache
        if: env.PROD_CF_ID != ''
        env:
          PROD_CF_ID: ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "Invalidating PRODUCTION CloudFront Distribution: $PROD_CF_ID..."
          aws cloudfront create-invalidation --distribution-id "$PROD_CF_ID" --paths "/*"
          echo "Production deployment successfully completed!"
